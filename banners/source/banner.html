<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>VSAP banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Phudu:wght@900&family=Lobster&family=Be+Vietnam+Pro:wght@700;800&display=block" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #fff; overflow: hidden; }
  #stage { position: relative; overflow: hidden; }
  canvas { position: absolute; inset: 0; }
  .abs { position: absolute; }
  img.abs { display: block; }
  .lt { position: absolute; white-space: nowrap; }
  .lt span { display: block; }
  .lt span + span { position: absolute; left: 0; top: 0; }
  .title { font-family: "Phudu", sans-serif; font-weight: 900; line-height: 1.05; letter-spacing: .01em; }
  .title .o { color: #fff; transform: translateY(.045em); filter: drop-shadow(0 .07em .09em rgba(8, 60, 18, .45)); }
  .title .x { color: #13702c; text-shadow: 0 .01em 0 #13702c, 0 .02em 0 #11682a, 0 .03em 0 #0f6026, 0 .04em 0 #0d5822, 0 .05em 0 #0b501f; -webkit-text-stroke: .012em #0b501f; }
  .title .f { background: linear-gradient(180deg, #c8f56a 0%, #74d23a 38%, #2fa233 70%, #17802a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .title .h { background: linear-gradient(180deg, rgba(255,255,255,.65) 0%, rgba(255,255,255,.15) 30%, rgba(255,255,255,0) 31%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .script { font-family: "Lobster", cursive; line-height: 1.3; }
  .script .o { color: #fff; transform: translateY(.03em); filter: drop-shadow(0 .05em .07em rgba(8, 60, 18, .4)); }
  .script .x { color: #0d5a22; transform: translateY(.03em); }
  .script .f { background: linear-gradient(180deg, #45b23a 0%, #1c8a2c 60%, #136a25 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .script .h { display: none; }
  .tagline { font-family: "Be Vietnam Pro", sans-serif; font-weight: 700; color: #17652c; letter-spacing: .02em; white-space: nowrap; }
  .shadow { border-radius: 50%; background: radial-gradient(closest-side, rgba(10, 50, 10, .55), rgba(10, 50, 10, 0)); }
  .jar { filter: drop-shadow(0 18px 22px rgba(10, 45, 10, .35)); }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<script>
const mobile = location.hash === "#mobile";
const W = mobile ? 1080 : 1920, H = mobile ? 1920 : 1080;
const stage = document.getElementById("stage");
stage.style.width = W + "px"; stage.style.height = H + "px";
const cv = document.getElementById("c"); cv.width = W; cv.height = H;
const ctx = cv.getContext("2d");

// Deterministic randomness so re-renders match.
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const R = (a, b) => a + rnd() * (b - a);
const pick = (a) => a[Math.floor(rnd() * a.length)];

// ---------- Sky ----------
const sky = ctx.createLinearGradient(0, 0, 0, H * .75);
sky.addColorStop(0, "#3f9fe3"); sky.addColorStop(.45, "#8fd0f6"); sky.addColorStop(1, "#eaf8ff");
ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
function glow(x, y, r, c) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, c); g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
glow(W * (mobile ? .2 : .16), H * .08, W * (mobile ? .9 : .55), "rgba(255,255,255,.85)");

// ---------- Clouds ----------
function cloud(cx, cy, s) {
  ctx.save();
  ctx.filter = `blur(${Math.round(5 * s)}px)`;
  for (let i = 0; i < 26; i++) {
    const x = cx + R(-170, 170) * s, y = cy + R(-30, 40) * s - Math.max(0, 70 - Math.abs(x - cx) / s * .4) * s * .6, r = R(40, 95) * s;
    const g = ctx.createRadialGradient(x, y + r * .25, 0, x, y + r * .25, r);
    g.addColorStop(0, "rgba(176,205,228,.45)"); g.addColorStop(1, "rgba(176,205,228,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y + r * .25, r, 0, 7); ctx.fill();
    const g2 = ctx.createRadialGradient(x - r * .2, y - r * .25, 0, x, y, r);
    g2.addColorStop(0, "rgba(255,255,255,1)"); g2.addColorStop(.55, "rgba(255,255,255,.85)"); g2.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.restore();
}
if (mobile) {
  [[180, 520, 1.1], [860, 430, 1.25], [560, 760, 1.5], [120, 900, 1.2], [980, 880, 1.1]].forEach((c) => cloud(...c));
} else {
  [[560, 250, 1.2], [880, 470, 1.6], [1180, 300, 1], [1540, 180, 1.2], [1780, 420, 1.1], [300, 520, 1.3], [80, 160, .9]].forEach((c) => cloud(...c));
}

// ---------- Hills ----------
function hillPath(f, x0 = 0, x1 = W) {
  ctx.beginPath(); ctx.moveTo(x0, H);
  for (let x = x0; x <= x1; x += 4) ctx.lineTo(x, f(x));
  ctx.lineTo(x1, H); ctx.closePath();
}
function layer(f, top, bottom, opts = {}) {
  ctx.save();
  if (opts.blur) ctx.filter = `blur(${opts.blur}px)`;
  hillPath(f, opts.x0, opts.x1);
  const g = ctx.createLinearGradient(0, opts.gTop ?? H * .5, 0, H);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
}
// Grass texture: many short blades clipped to the hill, plus blades poking over the edge.
function grass(f, n, palette, len, opts = {}) {
  const x0 = opts.x0 ?? 0, x1 = opts.x1 ?? W;
  ctx.save();
  if (opts.blur) ctx.filter = `blur(${opts.blur}px)`;
  ctx.lineCap = "round";
  for (let i = 0; i < n; i++) {
    const x = R(x0, x1), top = f(x);
    // Denser near the crest.
    const y = top + Math.pow(rnd(), 1.8) * (H - top + 20);
    const l = len * R(.5, 1.3) * (0.6 + (y - top) / (H - top + 1) * .9);
    const a = R(-.35, .35) + (opts.lean ?? 0);
    ctx.strokeStyle = pick(palette); ctx.lineWidth = R(1.2, 2.6) * (opts.w ?? 1);
    ctx.globalAlpha = R(.35, .9);
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + Math.sin(a) * l * .5, y - l * .6, x + Math.sin(a) * l, y - l);
    ctx.stroke();
  }
  ctx.restore();
}
function shade(f, opts = {}) {
  // Sunlit crest and darker foot.
  ctx.save(); hillPath(f, opts.x0, opts.x1); ctx.clip();
  const g = ctx.createLinearGradient(0, opts.y0, 0, opts.y1);
  g.addColorStop(0, "rgba(210,255,140,.35)"); g.addColorStop(.35, "rgba(210,255,140,0)"); g.addColorStop(1, "rgba(10,60,10,.35)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
}

const S = (x, a, p, o = 0) => Math.sin(x / p + o) * a;
const lightG = ["#a7e06c", "#8fd35a", "#7cc84c", "#c3ec86"];
const midG = ["#5fb43c", "#4ea432", "#6fc248", "#3d8f2a", "#88cf55"];
const darkG = ["#2f7d22", "#3b8f2a", "#256b1c", "#4ea43a", "#6cbf45"];

if (!mobile) {
  const far = (x) => H * .62 + S(x, 26, 210) + S(x, 14, 90, 2);
  layer(far, "#b5dba0", "#86bf6c", { blur: 2 });
  ctx.save(); ctx.globalAlpha = .35; ctx.fillStyle = "#eaf8ff"; hillPath(far); ctx.fill(); ctx.restore();
  const mid = (x) => H * .69 + S(x, 34, 260, 1) + S(x, 16, 120, .5);
  layer(mid, "#8fd462", "#3f9a2c", { blur: 1 });
  grass(mid, 9000, midG, 9, { blur: .6 });
  shade(mid, { y0: H * .64, y1: H });
  // Right hill under the jars, rising from the bottom-right.
  const right = (x) => H * .80 - Math.max(0, (x - W * .45)) * .22 + S(x, 12, 70) + Math.pow(Math.max(0, x - W * .92) / 80, 2) * 4;
  layer(right, "#78c64a", "#2b7a20", { x0: W * .42 });
  grass(right, 26000, darkG.concat(midG), 18, { x0: W * .42, lean: -.15 });
  shade(right, { y0: H * .6, y1: H, x0: W * .42 });
  // Left foreground mound.
  const left = (x) => H * .86 + Math.pow(x / W, 2) * H * .22 - S(x, 18, 140);
  layer(left, "#6fc044", "#24661a", { x1: W * .62 });
  grass(left, 26000, darkG.concat(lightG), 22, { x1: W * .62, lean: .1 });
  shade(left, { y0: H * .8, y1: H, x1: W * .62 });
} else {
  const far = (x) => H * .55 + S(x, 30, 160) + S(x, 12, 70, 2);
  layer(far, "#b5dba0", "#86bf6c", { blur: 2 });
  ctx.save(); ctx.globalAlpha = .35; ctx.fillStyle = "#eaf8ff"; hillPath(far); ctx.fill(); ctx.restore();
  const mid = (x) => H * .62 + S(x, 40, 210, 1) + S(x, 14, 90, .5);
  layer(mid, "#8fd462", "#3f9a2c", { blur: 1 });
  grass(mid, 8000, midG, 9, { blur: .6 });
  shade(mid, { y0: H * .58, y1: H });
  const front = (x) => H * .80 - (x / W) * H * .05 + S(x, 26, 120, 2);
  layer(front, "#78c64a", "#24661a");
  grass(front, 30000, darkG.concat(midG, lightG), 20, { lean: -.05 });
  shade(front, { y0: H * .76, y1: H });
}

// ---------- Daisies ----------
function daisy(x, y, r, blur = 0) {
  ctx.save(); if (blur) ctx.filter = `blur(${blur}px)`;
  ctx.strokeStyle = "#3f8f2a"; ctx.lineWidth = Math.max(1.5, r * .18);
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + R(-10, 10), y + r * 3, x + R(-6, 6), y + r * 6); ctx.stroke();
  const n = 12;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + R(-.1, .1);
    ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(1, .82);
    ctx.fillStyle = i % 2 ? "#ffffff" : "#f4f7f2";
    ctx.beginPath(); ctx.ellipse(r * .55, 0, r * .55, r * .17, 0, 0, 7); ctx.fill(); ctx.restore();
  }
  const g = ctx.createRadialGradient(x - r * .1, y - r * .1, 0, x, y, r * .3);
  g.addColorStop(0, "#ffe66b"); g.addColorStop(1, "#e8a21a");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * .28, 0, 7); ctx.fill();
  ctx.restore();
}
const daisies = mobile
  ? [[150, 1640, 18], [210, 1700, 14], [120, 1760, 20], [930, 1700, 16], [980, 1640, 13], [880, 1780, 18], [300, 1800, 15], [70, 1560, 12, 1.5]]
  : [[190, 770, 16], [240, 830, 13], [150, 870, 18], [300, 900, 14], [220, 960, 20], [330, 990, 15], [110, 1000, 17], [860, 920, 12], [905, 880, 10, 1], [960, 960, 14], [1800, 820, 12], [1850, 880, 14], [1760, 940, 11], [1880, 990, 16]];
daisies.forEach((d) => daisy(...d));

// ---------- Leaves ----------
function leaf(x, y, s, rot, blur = 0, tone = 0) {
  ctx.save(); if (blur) ctx.filter = `blur(${blur}px)`;
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  const g = ctx.createLinearGradient(-40, -20, 40, 20);
  g.addColorStop(0, tone ? "#6fbf3a" : "#b8ec6a"); g.addColorStop(1, tone ? "#2f8a25" : "#56b234");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-50, 0);
  ctx.bezierCurveTo(-20, -34, 30, -30, 52, 0);
  ctx.bezierCurveTo(30, 26, -20, 30, -50, 0); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-50, 0); ctx.quadraticCurveTo(0, -4, 50, 0); ctx.stroke();
  ctx.restore();
}
window.__leavesFront = () => {
  const fc = document.createElement("canvas"); fc.width = W; fc.height = H; fc.className = "abs"; fc.style.inset = 0; fc.style.zIndex = 20;
  stage.appendChild(fc);
  const save = ctx; const c2 = fc.getContext("2d");
  // Reuse the leaf drawer on the front canvas.
  const draw = (...a) => { const prev = window.ctxRef; leafOn(c2, ...a); };
  return c2;
};
function leafOn(c, x, y, s, rot, blur = 0, tone = 0) {
  c.save(); if (blur) c.filter = `blur(${blur}px)`;
  c.translate(x, y); c.rotate(rot); c.scale(s, s);
  const g = c.createLinearGradient(-40, -20, 40, 20);
  g.addColorStop(0, tone ? "#6fbf3a" : "#b8ec6a"); g.addColorStop(1, tone ? "#2f8a25" : "#56b234");
  c.fillStyle = g;
  c.beginPath(); c.moveTo(-50, 0);
  c.bezierCurveTo(-20, -34, 30, -30, 52, 0);
  c.bezierCurveTo(30, 26, -20, 30, -50, 0); c.fill();
  c.strokeStyle = "rgba(255,255,255,.45)"; c.lineWidth = 2;
  c.beginPath(); c.moveTo(-50, 0); c.quadraticCurveTo(0, -4, 50, 0); c.stroke();
  c.restore();
}
if (mobile) { leaf(930, 330, .9, -.5); leaf(120, 1260, .6, .7, 1.5, 1); }
else { leaf(1560, 150, .8, -.5); leaf(1000, 160, .5, .6, 2, 1); leaf(820, 640, .45, -.9, 1.5); }

// ---------- DOM layer: jars, nuts, text, badge ----------
function el(html, css) {
  const d = document.createElement("div"); d.innerHTML = html.trim();
  const n = d.firstChild; n.classList.add("abs"); Object.assign(n.style, css); stage.appendChild(n); return n;
}
function img(src, css, cls = "") { return el(`<img src="${src}" class="${cls}">`, css); }

const L = mobile
  ? {
      logo: { left: "375px", top: "215px", width: "330px" },
      type: { cx: 540, top: 385, titleW: 800, scriptW: 620, scriptAt: .58, rot: -5 },
      badge: { left: "135px", top: "800px", size: 200 },
      macca: { left: "640px", top: "1030px", height: "610px" },
      maccaShadow: { left: "600px", top: "1590px", width: "380px", height: "70px" },
      cashew: { left: "200px", top: "930px", height: "720px" },
      cashewShadow: { left: "150px", top: "1600px", width: "600px", height: "90px" },
      loose: { left: "110px", top: "1540px", width: "220px", transform: "rotate(-12deg)" },
      nuts: { left: "770px", top: "1560px", width: "250px" },
    }
  : {
      logo: { left: "345px", top: "195px", width: "350px" },
      type: { cx: 520, top: 360, titleW: 800, scriptW: 600, scriptAt: .6, rot: -6 },
      badge: { left: "800px", top: "730px", size: 200 },
      macca: { left: "1430px", top: "330px", height: "560px" },
      maccaShadow: { left: "1390px", top: "845px", width: "360px", height: "70px" },
      cashew: { left: "1020px", top: "250px", height: "700px" },
      cashewShadow: { left: "960px", top: "895px", width: "600px", height: "90px" },
      loose: { left: "470px", top: "830px", width: "200px", transform: "rotate(-14deg)" },
      nuts: { left: "1660px", top: "770px", width: "230px" },
    };

el(`<div class="shadow"></div>`, L.maccaShadow);
img("jar-macca.png", L.macca, "jar");
el(`<div class="shadow"></div>`, L.cashewShadow);
img("jar-cashew.png", L.cashew, "jar");
img("home_coll_1_banner.webp", { ...L.nuts, filter: "drop-shadow(0 12px 14px rgba(10,45,10,.35))" });
img("cashew-loose.webp", { ...L.loose, filter: "drop-shadow(0 14px 16px rgba(10,45,10,.35))" });

img("logo.svg", { ...L.logo, filter: "drop-shadow(0 0 2px #fff) drop-shadow(0 0 18px rgba(255,255,255,.9))" });
// Lettering: white outline, dark-green extrusion, gradient face, top gloss — sized to a target width.
async function lettering() {
  await Promise.all([document.fonts.load('900 100px "Phudu"', "TINH HOA"), document.fonts.load('100px "Lobster"', "nông sản Việt")]);
  const make = (text, cls) => {
    const n = el(`<div class="lt ${cls}"><span class="o">${text}</span><span class="x">${text}</span><span class="f">${text}</span><span class="h">${text}</span></div>`, { fontSize: "100px" });
    return n;
  };
  // Round white outline: a ring of text-shadows (text-stroke gives square spikes on Phudu's sharp corners).
  const ring = (n, r) => {
    const s = [];
    for (const k of [1, .66, .33]) for (let i = 0; i < 32; i++) {
      const a = (i / 32) * Math.PI * 2;
      s.push(`${(Math.cos(a) * r * k).toFixed(4)}em ${(Math.sin(a) * r * k).toFixed(4)}em 0 #fff`);
    }
    n.querySelector(".o").style.textShadow = s.join(",");
  };
  const fit = (n, w) => { n.style.fontSize = (100 * w / n.querySelector(".f").offsetWidth).toFixed(1) + "px"; };
  const T = L.type;
  const title = make("TINH HOA", "title"); ring(title, .085); fit(title, T.titleW);
  const tw = title.offsetWidth, th = title.offsetHeight;
  title.style.left = (T.cx - tw / 2) + "px"; title.style.top = T.top + "px";
  const script = make("nông sản Việt", "script"); ring(script, .075); fit(script, T.scriptW);
  const sw = script.offsetWidth, sh = script.offsetHeight;
  script.style.left = (T.cx - tw / 2 + tw * T.scriptAt - sw / 2) + "px";
  script.style.top = (T.top + th * 1.0 - sh * .14) + "px";
  script.style.transform = `rotate(${T.rot}deg)`;
  window.__type = { title: [title.offsetLeft, title.offsetTop, tw, th], script: [script.offsetLeft, script.offsetTop, sw, sh] };
}

// Seal badge: scalloped green disc with a gold ring.
{
  const s = L.badge.size, pts = [], n = 36;
  for (let i = 0; i < n * 2; i++) {
    const a = (i / (n * 2)) * Math.PI * 2, r = i % 2 ? s / 2 : s / 2 - 9;
    pts.push(`${(s / 2 + Math.cos(a) * r).toFixed(1)},${(s / 2 + Math.sin(a) * r).toFixed(1)}`);
  }
  const star = (cx, cy, r) => {
    const p = [];
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? r * .45 : r; p.push(`${(cx + Math.cos(a) * rr).toFixed(1)},${(cy + Math.sin(a) * rr).toFixed(1)}`); }
    return `<polygon points="${p.join(" ")}" fill="#fff"/>`;
  };
  const stars = (y) => [-2, -1, 0, 1, 2].map((k) => star(s / 2 + k * 15, y + Math.abs(k) * 2, 5)).join("");
  el(
    `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd23d"/><stop offset="1" stop-color="#1b8a2c"/></linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#e2b33c"/><stop offset="1" stop-color="#a8761a"/></linearGradient>
        <radialGradient id="shine" cx=".35" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      </defs>
      <polygon points="${pts.join(" ")}" fill="url(#bg)"/>
      <circle cx="${s / 2}" cy="${s / 2}" r="${s / 2 - 22}" fill="none" stroke="url(#gold)" stroke-width="7"/>
      <circle cx="${s / 2}" cy="${s / 2}" r="${s / 2 - 30}" fill="#1f8f2e"/>
      <circle cx="${s / 2}" cy="${s / 2}" r="${s / 2 - 30}" fill="url(#shine)"/>
      ${stars(s / 2 - 50)}
      <text x="${s / 2}" y="${s / 2 - 4}" text-anchor="middle" font-family="Phudu" font-weight="900" font-size="25" letter-spacing="0.5" fill="#fff">GOOD FOOD</text>
      <text x="${s / 2}" y="${s / 2 + 22}" text-anchor="middle" font-family="Phudu" font-weight="900" font-size="21" letter-spacing="0.5" fill="#fff3b0">GOOD HEALTH</text>
      ${stars(s / 2 + 52)}
    </svg>`,
    { left: L.badge.left, top: L.badge.top, filter: "drop-shadow(0 10px 14px rgba(10,50,10,.4))" },
  );
}

// Leaves in front of everything (soft focus), like the reference's foreground leaf.
{
  const c2 = window.__leavesFront();
  if (mobile) { leafOn(c2, 1000, 1830, 2.2, -.8, 6, 1); leafOn(c2, 70, 260, 1.1, .4, 3); }
  else { leafOn(c2, 1360, 1040, 2.6, -.9, 7, 1); leafOn(c2, 1180, 120, .9, .5, 2.5); }
}

lettering().then(() => document.fonts.ready).then(() => Promise.all([...document.images].map((i) => i.decode().catch(() => {})))).then(() => (document.title = "ready"));
</script>
</body>
</html>
